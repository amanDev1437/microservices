server:
    port: 8080

spring:
  application:
    name: "accounts"
  datasource:
    url: jdbc:mysql://localhost:3307/accounts
    username: root
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always

  config:
    import: "optional:configserver:http://localhost:8071/"
  profiles:
    active: "prod"
